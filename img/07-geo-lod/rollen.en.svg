<text x="80.0" y="821.0" text-anchor="start" dominant-baseline="auto" font-family="Fira Sans" font-size="12.5" font-weight="500" fill="#2c2c2a">74 CI findspots: 14 fsl:high, 47 medium, 6 low, 5 dubious · 43 with Wikidata, 31 with OSM, 20 with both · 13 spatial types from fsl:Cave to fsl:ModernRegion</text>
<text x="80.0" y="841.0" text-anchor="start" dominant-baseline="auto" font-family="Fira Sans" font-size="12" fill="#5f5e5a">SISAL v3: 305 sites, 37 of them archaeological, 5 with a QID and an OSM id, 7 on the World Heritage list · the uncertainty lives in the dataset, not in a footnote</text>
