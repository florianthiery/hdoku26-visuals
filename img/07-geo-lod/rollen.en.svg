<text x="80.0" y="888.0" text-anchor="start" dominant-baseline="auto" font-family="Fira Sans" font-size="13" font-weight="500" fill="#a03030">What identifiers do on top: they make a dataset&apos;s own errors findable</text>
<text x="80.0" y="909.0" text-anchor="start" dominant-baseline="auto" font-family="Fira Sans" font-size="12" fill="#2c2c2a">Findspot 22 (Phlegraean Fields) points at OSM node 10879170567 — which is Crvena stijena, Montenegro (wikidata=Q121418883); the method note in the same row names the correct node 4948370721.</text>
<text x="80.0" y="928.0" text-anchor="start" dominant-baseline="auto" font-family="Fira Sans" font-size="12" fill="#2c2c2a">Findspot 48 is labelled “Susak Island (Greece)” — relation 9854999 and GeoNames 3189468 are both in Croatia (OSM: wikipedia=hr:Susak). Both are only noticeable because those cells hold identifiers and not prose.</text>
