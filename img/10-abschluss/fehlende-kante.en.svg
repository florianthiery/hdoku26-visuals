<text x="76.0" y="866.0" text-anchor="start" dominant-baseline="auto" font-family="Fira Sans" font-size="16" fill="#2c2c2a">Four of five gaps are one statement wide. And the flow already runs both ways: the coordinate in the GND record for Seelow comes from GeoNames.</text>
