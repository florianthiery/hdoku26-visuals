# Case study Ogham (step 05) -- values that are not in any of the machine-readable
# files under data/raw/. Everything here was supplied by Florian Thiery on
# 2026-09-28 in tmp/s5-ogham/fragebogen.md (answers A-G), unless a line names
# another source.

stones:
  ciic81:
    label: CIIC 81
    title_de: CIIC 81 · Garranes / Cork
    title_en: CIIC 81 · Garranes / Cork
    epidoc: I-COR-030
    cisp: GARES/1
    ogham_lod: Y50000081
    wikidata: Q130529871
    fuzzy_sl: Q74
    osm_node: 11071361392
    smr_stone_findspot: CO084-090003-      # EpiDoc: record at the findspot
    smr_stone_keeper: CO074-148----        # Wikidata P4057 and OSM ref:IE:smr: record at UCC
    inventory: UCC Stone Corridor, no. 4
    findspot_is_current: false
    distance_km: 20.5                      # tei--epidoc-crosswalk docs/keepers.csv
  ciic178:
    label: CIIC 178
    title_de: CIIC 178 · Coumeenoole North
    title_en: CIIC 178 · Coumeenoole North
    epidoc: I-KER-046
    cisp: COUME/1
    ogham_lod: Y50000178
    wikidata: Q126503090
    fuzzy_sl: Q131
    osm_node: 5145413640
    smr_stone: KE052-059002-
    smr_fort: KE052-059001-                # Historic Environment Viewer, screenshot 2026-09-28
    findspot_is_current: true
    re_erected: 1839                       # EpiDoc I-KER-046, after Macalister 1945, 170

# Answer A1: the OSM tag wikidata=Q106680733 on the CIIC 81 node points at the
# "Squirrel Stone" umbrella item of ogham-lod v1 and should be replaced by
# Q130529871, the modelled stone.
osm_wikidata_tag:
  ciic81:
    value: Q106680733
    is_umbrella: true
    should_be: Q130529871
  ciic178:
    value: Q70892682                       # CIIC 178 concept by Macalister
    is_concept: true
    should_be: Q126503090

# Answer B5 + G3: the findspot of CIIC 81 in the chain is the ringfort; the Ogham
# Site sits beside it as a spatially related node. Wikidata holds no direct
# statement between the two (same junction pattern as figure 03).
findspot_ciic81:
  chain_node: Q141591358                   # Ringfort Lisheenagreine, SMR CO084-090001-, OSM way 1252604956
  spatial_relation_to: Q69385525           # Garranes (Ogham Site)
  linked_in_wikidata: false
  souterrain_smr: CO084-090002-
  gnd: '1248049489'                        # GND "Garranes, Ringwallanlage" = this ringfort

# Answer G2: labels of the fuzzy-sl properties and qualifier items
fuzzy_sl:
  properties:
    P4: has coordinate
    P5: certainty level
    P6: source type (generic)
    P7: method used
    P13: certainty description
    P14: acting person
    P15: method description
    P16: source type (detail)
    P23: precision
    P24: location type
    P33: point type
  items:
    Q23: High
    Q24: Low
    Q17: Georeferencing
    Q77: on-site survey
  statements:
    ciic81:
      - place_de: UCC Cork
        place_en: UCC Cork
        type_de: Ausstellungsort
        type_en: exhibition site
        certainty: High
        method_de: Survey vor Ort
        method_en: on-site survey
      - place_de: Garranes
        place_en: Garranes
        type_de: Fundort
        type_en: findspot
        certainty: Low
        method_de: aus Text georeferenziert
        method_en: georeferenced from text
    ciic178:
      - place_de: Dunmore Head
        place_en: Dunmore Head
        type_de: Ausstellungsort
        type_en: exhibition site
        certainty: High
        method_de: Survey vor Ort
        method_en: on-site survey
      - place_de: Dunmore Head
        place_en: Dunmore Head
        type_de: Fundort
        type_en: findspot
        certainty: Low
        method_de: Macalister 1945, 170
        method_en: Macalister 1945, 170

# Answer D4: readings side by side, kept short.
readings:
  ciic81:
    - source_de: OG(H)AM-Edition (N. White)
      source_en: OG(H)AM edition (N. White)
      text: C[A]SSITT[A]S MAQI MU[CO]I CALLITI
    - source_de: Macalister 1945
      source_en: Macalister 1945
      text: C[A]SSITT[A]S MAQI MUCOI CALLITI
    - source_de: Gippert 1987
      source_en: Gippert 1987
      text: '[CA]SSI[O]TTAS MAQI MU[CO]I CALLITI'
    - source_de: OpenStreetMap
      source_en: OpenStreetMap
      text: C[A]SSITT[A/O]S MAQI MU[CO]I CALLITI
  ciic178:
    - source_de: OG(H)AM-Edition (N. White)
      source_en: OG(H)AM edition (N. White)
      text: ERC MAQI MAQI-ERCIAS MU DOVINIA
      uncertain: [20, 22, 23, 28, 30]      # character positions underdotted in the edition
    - source_de: OpenStreetMap
      source_en: OpenStreetMap
      text: ERC MAQI MAQI-ERCIAS MU DOVINIA
  translation_ciic178_en: of Erc son of Mac-Erce descendant? of Duibne
  translation_ciic178_de: des Erc, Sohn des Mac-Erce, Nachkomme? der Duibne

