# poseidon.yaml -- everything for the poseidon2lod case study (step 09) that is
# not in the two .janno files, the RDF excerpt or the OSM exports.
#
# Zwei Individuen aus zwei Paketen des Poseidon Community Archive, deren
# Fundorte auf völlig verschiedene Weise benannt sind: im Lechtal nach einem
# Gewerbegebiet, an der Theiß nach einer Flur. Die Fallstudie vergleicht nicht
# Datenqualität, sondern Namenstypen -- und dabei gewinnt jedes System an einer
# anderen Stelle.
#
# GND-Nummern und Entitätentypen: Handrecherche im GND Explorer, 2026-09-29.

sites:
  lechtal:
    individual: "AITI_119"
    title_de: "Kleinaitingen-Gewerbegebiet Nord · Lechtal, Bayern"
    title_en: "Kleinaitingen-Gewerbegebiet Nord · Lech valley, Bavaria"
    package: "2019_Mittnik_BAEurope"
    publication: "Mittnik u. a. 2019"
    kind_de: "der Fundort heißt wie das Baugebiet"
    kind_en: "the findspot is named after the development site"
    # Die Site-Spalte fehlt in diesem Paket; der feinste Ortsname steht in
    # Location. Im RDF wird daraus ein Blank Node.
    site_column: false
    osm_de: "OSM kennt die Fläche: way 376729440, landuse=commercial, benannt"
    osm_en: "OSM has the area: way 376729440, landuse=commercial, named"
  tisza:
    individual: "RKC001"
    title_de: "Rákóczifalva – Bagi-földek · Mitteltheiß, Ungarn"
    title_en: "Rákóczifalva – Bagi-földek · Middle Tisza, Hungary"
    package: "2024_GnecchiRuscone_CarpathianBasinAvarPedigrees"
    publication: "Gnecchi-Ruscone u. a. 2024"
    kind_de: "der Fundort heißt wie die Flur"
    kind_en: "the findspot is named after the field"
    site_column: true
    osm_de: "OSM kennt „Bagi-földek“ nicht: 0 Objekte im 3-km-Umkreis"
    osm_en: "OSM does not have “Bagi-földek”: 0 objects within 3 km"

# Die weiteren Ortsangaben desselben Lech-Pakets. Sie sind das Argument der
# linken Spalte, deshalb stehen sie wörtlich in Grafik A.
