  - ["Kleinaitingen-Gewerbegebiet Nord", 31]
  - ["Oberottmarshausen-Kiesgrube Lauter", 20]
  - ["Königsbrunn-Obere Kreuzstraße, Baugebiet 110", 18]
  - ["Haunstetten-Postillionstraße", 15]
  - ["Wehringen-Hochfeld", 9]
  - ["Augsburg-Hugo-Eckener-Straße", 7]
  - ["Haunstetten-Unterer Talweg 58–62", 7]
  - ["Königsbrunn-Ampack", 1]
  - ["Friedberg-Metzgerwäldchen", 1]

# Fünf Einträge an einer Straße, jeder mit eigener Koordinate.
talweg:
  street: "Unterer Talweg"
  osm: "way 33401827 · way 186888644 · highway=tertiary"
  entries: ["58–62", "85", "85 I, northern group", "89", "121"]
  note_de: >-
    Fünf Ortsangaben desselben Pakets liegen an einer Straße, mit Hausnummern
    und je eigener Koordinate, 300 bis 500 m auseinander. OSM führt die Straße;
    ein Gazetteer historischer Orte wird sie nie führen.
  note_en: >-
    Five location strings of the same package sit along one street, with house
    numbers and a coordinate each, 300 to 500 m apart. OSM has the street; a
    gazetteer of historical places never will.

