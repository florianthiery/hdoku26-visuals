# Die Ebene daneben. Links eine Eingemeindung von 1972, rechts eine ganze
# Familie von Landschaftsbegriffen -- beides führt nur die GND.
aside:
  lechtal:
    name_de: "Haunstetten → Augsburg-Haunstetten"
    name_en: "Haunstetten → Augsburg-Haunstetten"
    ids_de: "GND 2012911-7 → 4096014-6"
    ids_en: "GND 2012911-7 → 4096014-6"
    hubs: {G: ok, W: open, O: open, F: none}
    note_de: >-
      Sieben Fundstellen des Pakets liegen in Haunstetten. Die GND führt es
      zweimal: bis 30.06.1972 als eigene Gemeinde, ab 01.07.1972 als
      Augsburg-Haunstetten mit Überordnung Augsburg. GeoNames hat für beide
      dieselbe ID 2909053.
    note_en: >-
      Seven findspots of the package lie in Haunstetten. The GND holds it twice:
      until 30 June 1972 as a municipality of its own, from 1 July 1972 as
      Augsburg-Haunstetten under Augsburg. GeoNames has one id, 2909053, for both.
  tisza:
    name_de: "Theiß-Landschaften in der GND"
    name_en: "Tisza landscapes in the GND"
    ids_de: "35 Treffer · gin 7 · giz 7 · gik 15"
    ids_en: "35 hits · gin 7 · giz 7 · gik 15"
    hubs: {G: ok, W: open, O: none, F: ok}
    note_de: >-
      Theiß selbst 4106223-1 (gin + gik), dazu Obere Theiß, Theiß-Gebiet,
      Theißwinkel, Tiszamente und Tiszántúl — sieben als Geografikum (giz).
      OSM hat für keine davon eine Grenze.
    note_en: >-
      Tisza itself (4106223-1, gin + gik) plus Upper Tisza, Tisza region,
      Theißwinkel, Danube-Tisza region and the Hungarian forms Tiszamente and
      Tiszántúl — seven of them as a region record (giz). Exactly the kind of
      unit “MiddleTisza” means, and OSM has no boundary for it.

