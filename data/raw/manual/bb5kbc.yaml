# bb5kbc.yaml -- everything for the bb-5kbc case study (step 08) that is not in
# the enriched CSV or in one of the Wikidata/OSM exports.
#
# Two findspots of the same culture (Stichbandkeramik), 500 km apart, from the
# dataset of https://github.com/Research-Squirrel-Engineers/bb-5kbc-sites:
# Seelow 20 in Brandenburg, georeferenced from the state heritage authority's
# own database, against Jordansmühl / Jordanów Śląski in Lower Silesia,
# georeferenced from a printed map of 1930 by reading off the centre of the
# municipality.
#
# GND numbers and entity types were looked up by hand in the GND Explorer on
# 2026-09-29. The entity type matters here: the GND separates a Gebiets-
# körperschaft (gik) from an administrative unit (giv), a region (giz) and a
# natural geographic unit (gin), and it dates them -- which is the one thing
# neither OSM nor Wikidata records this systematically.

sites:
  seelow:
    katalognr: "55005"
    fst_id: "406"
    title_de: "Seelow 20 · Märkisch-Oderland, Brandenburg"
    title_en: "Seelow 20 · Märkisch-Oderland, Brandenburg"
    claim_de: "aus der Datenbank des Landesdenkmalamts übernommen"
    claim_en: "taken from the state heritage authority's database"
    monument_de: "Bodendenkmal Seelow 2"
    monument_en: "Bodendenkmal Seelow 2"
    activity: "GV 2001:186/9g"
    occasion_de: "Ortsumgehung der B 1n"
    occasion_en: "the B 1n bypass"
    # Übersetzung der verbatim aus dem CSV übernommenen Methodenbeschreibung,
    # damit die englische Fassung lesbar bleibt.
    method_en: "the coordinates were requested from the BLDAM and adopted"
  jordansmuehl:
    katalognr: "7"
    title_de: "Jordansmühl / Jordanów Śląski · Woiwodschaft Niederschlesien"
    title_en: "Jordansmühl / Jordanów Śląski · Lower Silesian Voivodeship"
    claim_de: "Mittelpunkt der Gemeinde, aus einer gedruckten Karte von 1930"
    claim_en: "centre of the municipality, read off a printed map of 1930"
    # Dieselbe Koordinate wie Dankwitz/Dankowice (Katalognr. 6); Gleinitz/
    # Glinica (23) liegt 2 km daneben. Drei Fundstellen, ein Punkt.
    shares_point_with: ["6"]
    nearby: ["23"]
    method_en: >-
      the municipality was looked up in digital map services and its approximate
      centre read off

