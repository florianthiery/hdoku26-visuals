# Die Ebene daneben ist in dieser Fallstudie eine zeitliche: beide Ketten haben
# einen Vorgänger, den es heute nicht mehr gibt und den die GND trotzdem führt.
# Genau das kann OSM nicht und Wikidata nur unvollständig.
aside:
  seelow:
    name_de: "Landkreis Seelow (bis 1992)"
    name_en: "Landkreis Seelow (until 1992)"
    ids_de: "GND-Vorgänger von 4336493-7"
    ids_en: "GND predecessor of 4336493-7"
    hubs: {G: ok, W: open, O: none, F: none}
    note_de: >-
      4336493-7 beginnt 1992 und nennt drei Vorgänger: Bad Freienwalde, Seelow
      und Strausberg. Eine Suche nach „Seelow“ liefert denselben Namen als gik,
      giv, giz und gin.
    note_en: >-
      4336493-7 begins in 1992 and names three predecessors: Bad Freienwalde,
      Seelow and Strausberg. A search for “Seelow” returns the same name as gik,
      giv, giz and gin.
  jordansmuehl:
    name_de: "Provinz Niederschlesien (1919–1938)"
    name_en: "Province of Lower Silesia (1919–1938)"
    ids_de: "GND 4042237-9"
    ids_en: "GND 4042237-9"
    hubs: {G: ok, W: open, O: none, F: none}
    note_de: >-
      Zwei Niederschlesien: die preußische Provinz 4042237-9, datiert und mit
      Vorgänger Schlesien, und die heutige Woiwodschaft 4596748-9. Die Karte,
      aus der verortet wurde, meint die erste.
    note_en: >-
      Two Lower Silesias: the Prussian province 4042237-9, dated and with Silesia
      as its predecessor, and today's voivodeship 4596748-9. The map it was
      georeferenced from means the first.

# Was die GND-Recherche am 2026-09-29 ergeben hat.
gnd_probe:
  seelow_hits_de: >-
    Suche „Seelow“, Filter Geografikum: Treffer als gik, giv, giz, gin und gir
  seelow_hits_en: >-
    search “Seelow”, filter Geografikum: hits as gik, giv, giz, gin and gir
  seelow_coord_de: "Koordinate im GND-Satz, Quelle GeoNames"
  seelow_coord_en: "coordinate in the GND record, source GeoNames"
  jordanow_de: "Jordanów Śląski: 0 Treffer · Jordansmühl: kein Geografikum"
  jordanow_en: "Jordanów Śląski: 0 hits · Jordansmühl: no place record"
  dolnoslaskie_hits: 21
  dolnoslaskie_de: >-
    Eine Suche nach „Dolnośląskie“ liefert 21 Geografika in Polen, darunter
    Wahlstatt (Liegnitz) und Milejowice (Wrocław) — Jordanów Śląski ist nicht
    dabei.
  dolnoslaskie_en: >-
    A search for “Dolnośląskie” returns 21 places in Poland, among them
    Wahlstatt (Liegnitz) and Milejowice (Wrocław) — Jordanów Śląski is not
    among them.
  dankowice_de: >-
    Und „Dankowice“ führt auf GND 1243188049, ein Dankowice in der Gemeinde
    Wilamowice, rund 250 km entfernt — derselbe Name, ein anderer Ort.
  dankowice_en: >-
    And “Dankowice” leads to GND 1243188049, a Dankowice in the municipality of
    Wilamowice some 250 km away — the same name, a different place.

# Die Begriffe. Hier ist die GND dicht, und hier schließt sich Grafik C.
terms:
  sbk:
    name_de: "Stichbandkeramik"
    name_en: "Stroke-ornamented ware"
    wikidata: Q1932196
    gnd: "4183246-2"
    gnd_type: "saz"
    broader_de: "Oberbegriff: Bandkeramik · GND-Systematik 16.3"
    broader_en: "broader term: Linear Pottery · GND classification 16.3"
  jordanow:
    name_de: "Jordansmühler Kultur"
    name_en: "Jordanów culture"
    gnd: "1231725982"
    gnd_type: "saz"
    synonym: "Jordanów-Kultur"
    time: "v4300–v3900"
    definition_de: >-
      „Jungneolithische Kultur, welche die Endphase der Lengyel-Kultur im
      östlichen Mitteleuropa markiert, Begriff 1906 von Hans Seger nach dem
      niederschlesischen Fundort Jordansmühl eingeführt“
    definition_en: >-
      "Late Neolithic culture marking the final phase of the Lengyel culture in
      eastern Central Europe; term introduced in 1906 by Hans Seger after the
      Lower Silesian findspot of Jordansmühl"
    note_de: >-
      Der Ortsname steht in der GND also nur im Definitionstext eines
      Sachbegriffs — als Fließtext, nicht als Verknüpfung, und ohne dass es den
      Ort selbst als Satz gäbe.
    note_en: >-
      So the place name survives in the GND only inside the definition of a
      subject term — as running text, not as a link, and without the place
      itself having a record at all.

