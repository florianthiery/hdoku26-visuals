# What the community wrote down for itself
project:
  wikidata: Q126443484
  concept: Q126443332
  name: WikiProject HolyWells
  by: Research Squirrel Engineers Network (Q73901970)
  model_de:
    - P31 auf das Holy Well Semantic Concept, unabhängig davon, ob noch verehrt wird
    - Zustand und Erhaltung als Qualifikatoren, mit Beleg
    - Namenspatron (P138) als Heilige:r oder als Körperteil für das geheilte Leiden
    - Belegpflicht über described by source (P1343)
  model_en:
    - P31 on the Holy Well Semantic Concept, whether or not veneration continues
    - state of use and conservation as qualifiers, with a reference
    - named after (P138) either the saint or the body part standing for the cure
    - sources required through described by source (P1343)
  sources_de: OS 6 Inch First Edition · Historic Environment Viewer · Schools' Collection · Ó Dálaigh
  sources_en: OS 6 Inch First Edition · Historic Environment Viewer · Schools' Collection · Ó Dálaigh

